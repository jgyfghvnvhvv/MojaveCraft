name: build-plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc
      - name: Compile 32-bit DLL
        shell: msys2 {0}
        run: g++ -std=c++17 -O2 -shared -static -static-libgcc -static-libstdc++ -o MojaveCraft.dll MojaveCraft.cpp
      - uses: actions/upload-artifact@v4
        with:
          name: MojaveCraft-dll
          path: MojaveCraft.dll
